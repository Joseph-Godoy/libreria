<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="style.css" rel="stylesheet">
    <script src="script.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&family=Roboto:ital,wght@0,100..900;1,100..900&family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <header class="encabezado">
        <h1 class="titulo_encabezado">The Library</h1>
        <button class="agregar" onclick="miDialog.showModal()">+</button>
    </header>
    <main class="seccion_principal">
        <section class="todos_libros">

        </section>

        <aside>
            <dialog id="miDialog">
                <form id="formulario-principal">
                    <button value="cancelar" type="button" onclick="miDialog.close()" class="salir">X</button>
                    <h4>Crea un Libro</h4>
                    <div>
                        <label for="nombre">Nombre:</label>
                        <input type="text" name="nombre" id="nombre" required />
                    </div>
                    <div>
                        <label for="autor">Autor:</label>
                        <input type="text" name="autor" id="autor" required />
                    </div>
                    <div>
                        <label for="paginas">Paginas:</label>
                        <input type="number" name="paginas" id="paginas" required />
                    </div>
                    
                    <input type="checkbox" name="leido" id="leido" class="leidoDialog">

                    <button value="guardar" form="formulario-principal" id="guardar" type="submit" class="btnGuardar">Guardar</button>
                </form>
            </dialog>
            
        </aside>

    </main>
</body>

</html>
